/* ===== Ame-chan Widget ===== */
#ame-widget {
  position: fixed;
  bottom: 90px;
  right: 20px;
  z-index: 9998;
  font-family: "Zen Maru Gothic", system-ui, sans-serif;
  pointer-events: none;
}
#ame-widget * { pointer-events: auto; }

#ame-gif {
  width: 140px;
  height: auto;
  cursor: pointer;
  transition: transform 0.2s ease, filter 0.2s;
  filter: drop-shadow(0 10px 16px rgba(180,70,100,0.35));
  user-select: none;
  position: relative;
  z-index: 2;
}
#ame-gif:hover { transform: scale(1.06) rotate(-2deg); }

#ame-chat {
  position: absolute;
  bottom: 148px;
  right: 8px;
  width: 330px;
  max-width: calc(100vw - 36px);
  height: 440px;
  background:
    radial-gradient(circle at 18% 0%, #fff 0 18px, transparent 19px),
    radial-gradient(circle at 82% 0%, #fff 0 18px, transparent 19px),
    linear-gradient(180deg, #fffafc 0%, #ffe3ee 100%);
  border: 3px solid #f3a0bb;
  border-radius: 72px 72px 46px 46px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow:
    0 18px 40px rgba(190, 80, 120, 0.28),
    inset 0 0 0 7px rgba(255,255,255,.72);
  opacity: 0;
  transform: translateY(14px) scale(0.94) rotate(1.5deg);
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s ease;
}
#ame-chat.open {
  opacity: 1;
  transform: translateY(0) scale(1) rotate(0deg);
  pointer-events: auto;
}
.ame-header {
  background: linear-gradient(90deg, #ffd0e0, #ffb7d0 40%, #ffd6c2);
  color: #5a2436;
  padding: 16px 16px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
}
.ame-header span::before { content: "♡  "; }
#ame-close {
  background: #fff;
  border: 2px solid #f3a0bb;
  color: #e25b88;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
#ame-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-width: thin;
  scrollbar-color: #f3a0bb transparent;
  background:
    repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(227,140,170,.18) 28px);
}
.ame-msg {
  max-width: 86%;
  padding: 10px 13px;
  font-size: 13.5px;
  line-height: 1.45;
  word-break: break-word;
  white-space: pre-wrap;
}
.ame-msg.user {
  align-self: flex-end;
  background: #e25b88;
  color: #fffafb;
  font-weight: 500;
  border-radius: 18px 18px 6px 18px;
  box-shadow: 0 6px 14px rgba(226,91,136,.25);
}
.ame-msg.ame {
  align-self: flex-start;
  background: #fff;
  color: #5a2436;
  border: 1.5px solid #f6c0d2;
  border-radius: 6px 18px 18px 18px;
  box-shadow: 0 4px 0 #ffd0e0;
}
.ame-input-area {
  display: flex;
  padding: 10px 12px 14px;
  gap: 8px;
  background: linear-gradient(180deg, transparent, #ffe3ee 30%);
}
#ame-input {
  flex: 1;
  background: #fff;
  border: 2px solid #f3a0bb;
  border-radius: 999px;
  padding: 9px 14px;
  color: #5a2436;
  outline: none;
  font-size: 14px;
}
#ame-input::placeholder { color: #c4899e; }
#ame-input:focus { border-color: #e25b88; box-shadow: 0 0 0 3px rgba(226,91,136,.18); }
#ame-send {
  background: #e25b88;
  border: none;
  color: #fff;
  padding: 0 16px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  box-shadow: 0 4px 0 #c43d6c;
}
#ame-send:active { transform: translateY(2px); box-shadow: 0 2px 0 #c43d6c; }
#ame-send:disabled { opacity: 0.5; cursor: wait; box-shadow: none; }
@media (max-width: 480px) {
  #ame-widget { bottom: 80px; right: 12px; }
  #ame-gif { width: 110px; }
  #ame-chat { width: 290px; height: 390px; bottom: 120px; }
}


#ame-gif{transform:translateX(var(--ame-tx,0px)) rotate(var(--ame-rot,0deg))}
#ame-gif.hop{animation:ame-hop .6s ease}#ame-gif.shake{animation:ame-shake .5s ease}#ame-gif.nod{animation:ame-nod .22s ease}
@keyframes ame-hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-24px) rotate(-4deg)}65%{transform:translateY(-6px) rotate(3deg)}}
@keyframes ame-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes ame-nod{50%{transform:translateY(4px) scale(.97)}}
#ame-bubble{position:absolute;right:4px;bottom:100%;margin-bottom:2px;width:max-content;max-width:min(230px,calc(100vw - 40px));background:#fff;color:#5a2436;border:2px solid #f3a0bb;border-radius:18px 18px 4px 18px;padding:9px 12px;font-size:13px;line-height:1.4;white-space:pre-wrap;box-shadow:0 5px 0 #ffd0e0,0 12px 24px rgba(190,80,120,.2);opacity:0;transform:translateY(8px) scale(.95);transition:opacity .2s,transform .2s;pointer-events:none!important;z-index:3;cursor:pointer}
#ame-bubble.show{opacity:1;transform:none;pointer-events:auto!important}
#ame-bubble.typing{animation:ame-pulse 1s infinite}@keyframes ame-pulse{50%{opacity:.55}}
#ame-widget.unread::after{content:"";position:absolute;top:2px;right:6px;width:14px;height:14px;border-radius:50%;background:#e25b88;border:2px solid #fff;z-index:4;pointer-events:none}
.ame-spark{position:fixed;z-index:9999;pointer-events:none;color:#e25b88;font-size:18px;animation:ame-spark 1.1s ease-out forwards}
@keyframes ame-spark{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
#ame-mute{margin-left:auto;margin-right:8px;background:#fff;border:2px solid #f3a0bb;color:#e25b88;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){#ame-gif.hop,#ame-gif.shake,#ame-gif.nod{animation:none}.ame-spark{display:none}}

/* ===== Music popup ===== */

/* history / queue / controls */
.mp-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 4px 0 2px;
}
.mp-ctrl {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: 999px;
  border: 2px solid #f6c0d2;
  background: #fff;
  color: #5a2436;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 2px 0 #ffd0e0;
}
.mp-ctrl[aria-pressed="true"] {
  background: #e25b88;
  color: #fff;
  border-color: #e25b88;
  box-shadow: 0 2px 0 #c43d6c;
}
.mp-ctrl:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.mp-ctrl:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 0 #ffd0e0; }
.mp-tabs {
  display: flex;
  gap: 4px;
  margin: 8px 0 6px;
}
.mp-tab {
  flex: 1;
  padding: 6px 4px;
  border: none;
  border-radius: 12px;
  background: transparent;
  color: #8a5568;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.mp-tab[aria-selected="true"] {
  background: #ffd0e0;
  color: #5a2436;
}
#mp-lists { max-height: 160px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #f3a0bb transparent; }
.mp-list { display: none; flex-direction: column; gap: 6px; }
.mp-list.active { display: flex; }
.mp-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 14px;
  border: 2px solid #f6c0d2;
  background: #fff;
  text-align: left;
  cursor: pointer;
  font-size: 12.5px;
  color: #5a2436;
}
.mp-item:hover { border-color: #f3a0bb; }
.mp-item .mp-item-main { flex: 1; min-width: 0; }
.mp-item .mp-item-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mp-item .mp-item-meta { font-size: 10.5px; color: #8a5568; }
.mp-item-actions { display: flex; gap: 4px; }
.mp-item-actions button {
  border: none;
  background: #ffe3ee;
  color: #e25b88;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 14px;
  cursor: pointer;
  line-height: 1;
  font-weight: 700;
}
.mp-empty-list {
  font-size: 12.5px;
  color: #8a5568;
  text-align: center;
  padding: 12px 8px;
}
.mp-now {
  font-size: 12px;
  color: #8a5568;
  margin: 0 0 4px;
  min-height: 1.2em;
}
.mp-now strong { color: #e25b88; }

#mp-widget {
  position: fixed;
  bottom: 90px;
  left: 20px;
  z-index: 9997;
  font-family: "Zen Maru Gothic", system-ui, sans-serif;
  color: #5a2436;
}
#mp-widget [hidden] { display: none !important; }
#mp-widget button, #mp-widget input { font-family: inherit; }
#mp-widget :focus-visible { outline: 3px solid rgba(226,91,136,.5); outline-offset: 2px; }

/* round vinyl button */
#mp-toggle {
  display: grid;
  place-items: center;
  width: 60px;
  height: 60px;
  padding: 0;
  border-radius: 50%;
  border: 3px solid #f3a0bb;
  background: linear-gradient(180deg, #fffafc, #ffd0e0);
  box-shadow: 0 10px 20px rgba(190,80,120,.28), inset 0 0 0 4px rgba(255,255,255,.72);
  cursor: pointer;
  transition: transform .2s ease;
}
#mp-toggle:hover { transform: scale(1.06) rotate(-3deg); }
#mp-toggle:active { transform: scale(.97); }
#mp-toggle svg { width: 38px; height: 38px; display: block; }
.mp-live #mp-toggle svg { animation: mp-spin 6s linear infinite; }
@keyframes mp-spin { to { transform: rotate(360deg); } }

/* popup */
#mp-panel {
  position: absolute;
  left: 0;
  bottom: 72px;
  width: 340px;
  max-width: calc(100vw - 36px);
  max-height: calc(100vh - 170px);
  max-height: calc(100dvh - 170px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: linear-gradient(180deg, #fffafc 0%, #ffe3ee 100%);
  border: 3px solid #f3a0bb;
  border-radius: 40px 40px 40px 12px;
  box-shadow: 0 18px 40px rgba(190,80,120,.28), inset 0 0 0 7px rgba(255,255,255,.72);
  transform-origin: bottom left;
  /* hidden, but the player inside stays alive so music keeps playing */
  visibility: hidden;
  opacity: 0;
  transform: translateY(14px) scale(.94) rotate(-1.5deg);
  pointer-events: none;
  transition: opacity .22s ease, transform .22s ease, visibility 0s linear .22s;
}
#mp-panel.open {
  visibility: visible;
  opacity: 1;
  transform: none;
  pointer-events: auto;
  transition-delay: 0s;
}

.mp-header {
  flex: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 16px 10px 24px;
  background: linear-gradient(90deg, #ffd0e0, #ffb7d0 40%, #ffd6c2);
  color: #5a2436;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .04em;
}
.mp-header span::before { content: "♡  "; }
.mp-header-btns { display: flex; gap: 6px; }
.mp-icon-btn {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid #f3a0bb;
  background: #fff;
  color: #e25b88;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.mp-icon-btn:not(:disabled):hover { background: #fff0f5; }
.mp-icon-btn:disabled { opacity: .45; cursor: default; }

.mp-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  padding: 12px 14px 18px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #f3a0bb transparent;
}

/* player window */
#mp-stage {
  position: relative;
  flex: none;
  aspect-ratio: 16 / 9;
  border: 2px solid #f3a0bb;
  border-radius: 22px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 4px 0 #ffd0e0;
  transition: height .25s ease;
}
#mp-stage[data-kind="spotify"] { aspect-ratio: auto; height: 152px; }
#mp-stage[data-kind="spotify"][data-tall="1"] { height: 352px; }
#mp-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
.mp-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px;
  text-align: center;
  font-size: 13px;
  line-height: 1.45;
  color: #8a5568;
  background: repeating-linear-gradient(180deg, #fffafc, #fffafc 27px, rgba(227,140,170,.18) 28px);
}
.mp-empty svg { width: 40px; height: 40px; }
.mp-empty p { margin: 0; }
#mp-stage.has-player .mp-empty { display: none; }

/* link box, same look as the chat input */
#mp-form { display: flex; gap: 8px; margin: 0; }
#mp-input {
  flex: 1;
  min-width: 0;
  background: #fff;
  border: 2px solid #f3a0bb;
  border-radius: 999px;
  padding: 9px 14px;
  color: #5a2436;
  outline: none;
  font-size: 14px;
}
#mp-input::placeholder { color: #c4899e; }
#mp-input:focus { border-color: #e25b88; box-shadow: 0 0 0 3px rgba(226,91,136,.18); }
#mp-go {
  background: #e25b88;
  border: none;
  color: #fff;
  padding: 0 16px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  box-shadow: 0 4px 0 #c43d6c;
}
#mp-go:active { transform: translateY(2px); box-shadow: 0 2px 0 #c43d6c; }
#mp-err { margin: -2px 6px 0; font-size: 12.5px; line-height: 1.45; color: #c43d6c; }

/* quick picks */
#mp-chips { display: flex; flex-wrap: wrap; gap: 8px 6px; }
.mp-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border-radius: 999px;
  border: 2px solid #f6c0d2;
  background: #fff;
  color: #5a2436;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 3px 0 #ffd0e0;
}
.mp-chip em {
  font-style: normal;
  font-size: 10.5px;
  font-weight: 700;
  color: #8a5568;
  background: #ffe3ee;
  border-radius: 999px;
  padding: 1px 7px;
}
.mp-chip:hover { border-color: #f3a0bb; }
.mp-chip:active { transform: translateY(2px); box-shadow: 0 1px 0 #ffd0e0; }
.mp-chip.is-last::before { content: "♡"; color: #e25b88; }
#mp-size { align-self: flex-start; }

@media (max-width: 480px) {
  #mp-widget { bottom: 80px; left: 12px; }
  #mp-toggle { width: 52px; height: 52px; }
  #mp-toggle svg { width: 32px; height: 32px; }
  #mp-panel { bottom: 64px; width: calc(100vw - 24px); max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  .mp-live #mp-toggle svg { animation: none; }
  #mp-panel, #mp-toggle, #mp-stage { transition: none; }
}

    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="22" fill="#5a2436"/>
      <circle cx="24" cy="24" r="17.5" fill="none" stroke="#7d3b53" stroke-width="1"/>

        <div class="mp-empty">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="22" fill="#5a2436"/>
            <circle cx="24" cy="24" r="17.5" fill="none" stroke="#7d3b53" stroke-width="1"/>

</div>

<script>
(function () {
  "use strict";

  const PRESETS = [
    { label: "lofi girl",      source: "youtube", url: "https://www.youtube.com/watch?v=jfKZnUIqYAA" },
    { label: "lofi beats",     source: "spotify", url: "https://open.spotify.com/playlist/37i9dQZF1DWWQRwui0ExPn" },
    { label: "peaceful piano", source: "spotify", url: "https://open.spotify.com/playlist/37i9dQZF1DX4sWSpwq3LiO" },
    { label: "join me in death", source: "youtube", url: "https://www.youtube.com/watch?v=gCYcHz2k5x0" }
  ];
  // note: join me in death id is a placeholder-ish; user can paste real link and it will history it
  const KEY = "mp-v2";
  const MAX_HISTORY = 40;

  const YT_ID = /^[\w-]{11}$/;
  const YT_LIST = /^[\w-]{10,64}$/;

  function bad() {
    return { error: "that link didn't work. paste a spotify track, album or playlist link, or a youtube video or playlist link." };
  }
  function spotify(type, id, raw) {
    return { kind: "spotify", type: type, id: id, url: raw, src: "https://open.spotify.com/embed/" + type + "/" + id + "?utm_source=generator" };
  }
  function youtube(src, raw, id, list) {
    return { kind: "youtube", type: list && !id ? "playlist" : "video", id: id || list, url: raw, src: src, ytId: id || null, list: list || null };
  }

  function parseLink(raw, loop) {
    raw = (raw || "").trim();
    const frame = raw.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i);
    if (frame) raw = frame[1];
    if (!raw) return { error: "paste a spotify or youtube link first." };

    let m = raw.match(/^spotify:(track|album|playlist|artist|episode|show):([A-Za-z0-9]+)$/);
    if (m) return spotify(m[1], m[2], raw);

    let u;
    try { u = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : "https://" + raw); }
    catch (e) { return bad(); }

    const host = u.hostname.toLowerCase().replace(/^(www|m|music)\./, "");

    if (host === "spotify.link" || host === "spotify.app.link") {
      return { error: "short spotify.link links can't be used. open it on open.spotify.com and copy that link instead." };
    }
    if (host === "open.spotify.com") {
      m = u.pathname.match(/\/(?:intl-[a-z-]+\/)?(?:embed\/)?(track|album|playlist|artist|episode|show)\/([A-Za-z0-9]+)/);
      return m ? spotify(m[1], m[2], raw) : bad();
    }
    if (host === "youtu.be" || host === "youtube.com" || host === "youtube-nocookie.com") {
      let id = null;
      const list = u.searchParams.get("list");
      if (host === "youtu.be") id = u.pathname.split("/")[1];
      else if (u.pathname === "/watch") id = u.searchParams.get("v");
      else {
        m = u.pathname.match(/^\/(?:embed|shorts|live|v)\/([\w-]{11})/);
        if (m) id = m[1];
      }
      let q = "autoplay=1&rel=0&playsinline=1";
      const withList = list && YT_LIST.test(list);
      if (id && YT_ID.test(id)) {
        if (loop) q += "&loop=1&playlist=" + id;
        return youtube("https://www.youtube-nocookie.com/embed/" + id + "?" + q + (withList && !loop ? "&list=" + list : ""), raw, id, withList ? list : null);
      }
      if (withList) {
        return youtube("https://www.youtube-nocookie.com/embed/videoseries?list=" + list + "&" + q, raw, null, list);
      }
    }
    return bad();
  }

  function fingerprint(p) {
    if (!p || p.error) return "";
    if (p.kind === "spotify") return "sp:" + p.type + ":" + p.id;
    if (p.kind === "youtube") return "yt:" + (p.ytId || "") + ":" + (p.list || "");
    return p.src || p.url;
  }

  function defaultLabel(p) {
    if (!p || p.error) return "unknown";
    if (p.kind === "spotify") {
      return p.type === "track" ? "spotify track" : "spotify " + p.type;
    }
    if (p.kind === "youtube") {
      return p.list && !p.ytId ? "youtube playlist" : "youtube video";
    }
    return "track";
  }

  const $ = (id) => document.getElementById(id);
  const widget = $("mp-widget"), toggle = $("mp-toggle"), panel = $("mp-panel");
  const closeBtn = $("mp-close"), stopBtn = $("mp-stop"), stage = $("mp-stage");
  const sizeBtn = $("mp-size"), form = $("mp-form"), input = $("mp-input");
  const errEl = $("mp-err");
  const nowEl = $("mp-now");
  const loopBtn = $("mp-loop"), shuffleBtn = $("mp-shuffle"), nextBtn = $("mp-next"), addQBtn = $("mp-addq");
  const listPresets = $("mp-list-presets"), listHistory = $("mp-list-history"), listQueue = $("mp-list-queue");
  if (!widget) return;

  let state = { history: [], queue: [], loop: false, shuffle: false, currentLabel: null, lastUrl: null };
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (raw) {
      state.history = Array.isArray(raw.history) ? raw.history : [];
      state.queue = Array.isArray(raw.queue) ? raw.queue : [];
      state.loop = !!raw.loop;
      state.shuffle = !!raw.shuffle;
      state.lastUrl = raw.lastUrl || null;
      state.currentLabel = raw.currentLabel || null;
    }
  } catch (e) {}

  // migrate old key
  try {
    const old = JSON.parse(localStorage.getItem("mp-v1") || "null");
    if (old && old.url && !state.lastUrl) {
      state.lastUrl = old.url;
      const p = parseLink(old.url);
      if (p.src) rememberPlay(p, "last played");
    }
  } catch (e) {}

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        history: state.history.slice(0, MAX_HISTORY),
        queue: state.queue.slice(0, 30),
        loop: state.loop,
        shuffle: state.shuffle,
        lastUrl: state.lastUrl,
        currentLabel: state.currentLabel
      }));
    } catch (e) {}
  }

  function rememberPlay(p, labelHint) {
    const fp = fingerprint(p);
    if (!fp) return;
    let label = labelHint || defaultLabel(p);
    // prefer preset name
    const preset = PRESETS.find(x => fingerprint(parseLink(x.url)) === fp);
    if (preset) label = preset.label;
    // keep existing label if we already knew a better one
    const existing = state.history.find(h => h.fp === fp);
    if (existing && existing.label && existing.label !== defaultLabel(p)) label = existing.label;

    state.history = state.history.filter(h => h.fp !== fp);
    state.history.unshift({
      fp, url: p.url, label, kind: p.kind, type: p.type || "", playCount: (existing ? existing.playCount : 0) + 1, lastPlayed: Date.now()
    });
    state.history = state.history.slice(0, MAX_HISTORY);
    state.lastUrl = p.url;
    state.currentLabel = label;
    persist();
  }

  function showError(msg) {
    errEl.textContent = msg || "";
    errEl.hidden = !msg;
  }

  function setOpen(open) {
    panel.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", String(open));
    toggle.setAttribute("aria-label", open ? "hide music player" : "open music player");
  }

  function updateNow() {
    if (state.currentLabel) {
      nowEl.innerHTML = "now · <strong>" + escapeHtml(state.currentLabel) + "</strong>" + (state.loop ? " · loop on" : "");
    } else {
      nowEl.textContent = "";
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  let current = null;

  function play(p, labelHint, fromQueue) {
    if (p.error) return showError(p.error);
    // re-parse with loop flag for youtube
    if (p.kind === "youtube" && state.loop && p.ytId) {
      p = parseLink(p.url, true);
    }

    const old = stage.querySelector("iframe");
    if (old) old.remove();

    const f = document.createElement("iframe");
    f.src = p.src;
    f.title = p.kind === "spotify" ? "spotify player" : "youtube player";
    f.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
    f.setAttribute("allowfullscreen", "");
    f.referrerPolicy = "strict-origin-when-cross-origin";
    stage.appendChild(f);

    stage.dataset.kind = p.kind;
    stage.dataset.tall = "0";
    stage.classList.add("has-player");
    widget.classList.add("mp-live");
    stopBtn.disabled = false;
    addQBtn.disabled = false;
    nextBtn.disabled = state.queue.length === 0;

    sizeBtn.hidden = !(p.kind === "spotify" && p.type !== "track" && p.type !== "episode");
    sizeBtn.textContent = "show tracks";
    sizeBtn.setAttribute("aria-pressed", "false");

    current = p;
    input.value = "";
    showError("");
    rememberPlay(p, labelHint);
    updateNow();
    renderAll();

    try {
      if (window.__ameNudge) window.__ameNudge("music", state.currentLabel);
    } catch (e) {}

    if (!fromQueue) { /* keep queue as is */ }
  }

  function stop() {
    const f = stage.querySelector("iframe");
    if (f) f.remove();
    delete stage.dataset.kind;
    stage.dataset.tall = "0";
    stage.classList.remove("has-player");
    widget.classList.remove("mp-live");
    stopBtn.disabled = true;
    sizeBtn.hidden = true;
    addQBtn.disabled = true;
    current = null;
    state.currentLabel = null;
    persist();
    updateNow();
  }

  function playNext() {
    if (!state.queue.length) {
      nextBtn.disabled = true;
      return;
    }
    let idx = 0;
    if (state.shuffle && state.queue.length > 1) {
      idx = Math.floor(Math.random() * state.queue.length);
    }
    const item = state.queue.splice(idx, 1)[0];
    persist();
    const p = parseLink(item.url, state.loop);
    if (p.error) {
      showError(p.error);
      playNext();
      return;
    }
    play(p, item.label, true);
  }

  function renderChipsLike(container, items, mode) {
    container.textContent = "";
    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "mp-empty-list";
      empty.textContent = mode === "history" ? "nothing played yet. paste a link and it will show up here." : mode === "queue" ? "queue is empty. play something, then + queue." : "no picks.";
      container.appendChild(empty);
      return;
    }
    items.forEach((it, i) => {
      const row = document.createElement("div");
      row.className = "mp-item";
      const main = document.createElement("div");
      main.className = "mp-item-main";
      const title = document.createElement("div");
      title.className = "mp-item-title";
      title.textContent = it.label;
      const meta = document.createElement("div");
      meta.className = "mp-item-meta";
      if (mode === "history") {
        meta.textContent = (it.kind || "") + (it.playCount ? " · ×" + it.playCount : "");
      } else if (mode === "queue") {
        meta.textContent = "#" + (i + 1) + " · " + (it.kind || "");
      } else {
        meta.textContent = it.source || it.kind || "";
      }
      main.append(title, meta);
      const actions = document.createElement("div");
      actions.className = "mp-item-actions";

      const playB = document.createElement("button");
      playB.type = "button";
      playB.title = "play";
      playB.textContent = "▶";
      playB.addEventListener("click", (e) => {
        e.stopPropagation();
        const p = parseLink(it.url, state.loop);
        if (p.error) return showError(p.error);
        play(p, it.label);
      });
      actions.appendChild(playB);

      if (mode === "history") {
        const qB = document.createElement("button");
        qB.type = "button";
        qB.title = "add to queue";
        qB.textContent = "+";
        qB.addEventListener("click", (e) => {
          e.stopPropagation();
          state.queue.push({ url: it.url, label: it.label, kind: it.kind, fp: it.fp });
          persist();
          nextBtn.disabled = false;
          renderAll();
        });
        actions.appendChild(qB);
        const del = document.createElement("button");
        del.type = "button";
        del.title = "remove from history";
        del.textContent = "×";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          state.history = state.history.filter(h => h.fp !== it.fp);
          persist();
          renderAll();
        });
        actions.appendChild(del);
      } else if (mode === "queue") {
        const del = document.createElement("button");
        del.type = "button";
        del.title = "remove";
        del.textContent = "×";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          state.queue.splice(i, 1);
          persist();
          nextBtn.disabled = state.queue.length === 0;
          renderAll();
        });
        actions.appendChild(del);
      }

      row.append(main, actions);
      row.addEventListener("click", () => {
        const p = parseLink(it.url, state.loop);
        if (p.error) return showError(p.error);
        play(p, it.label);
      });
      container.appendChild(row);
    });
  }

  function renderAll() {
    // presets
    const presetItems = PRESETS.map(p => ({ label: p.label, source: p.source, url: p.url, kind: p.source }));
    if (state.lastUrl) {
      const already = presetItems.some(x => fingerprint(parseLink(x.url)) === fingerprint(parseLink(state.lastUrl)));
      if (!already) {
        const hist = state.history.find(h => h.url === state.lastUrl);
        presetItems.unshift({ label: hist ? hist.label : "last played", source: hist ? hist.kind : "link", url: state.lastUrl, kind: hist ? hist.kind : "" });
      }
    }
    renderChipsLike(listPresets, presetItems, "presets");
    renderChipsLike(listHistory, state.history, "history");
    renderChipsLike(listQueue, state.queue, "queue");
    loopBtn.setAttribute("aria-pressed", String(state.loop));
    shuffleBtn.setAttribute("aria-pressed", String(state.shuffle));
    nextBtn.disabled = state.queue.length === 0;
    updateNow();
  }

  // tabs
  document.querySelectorAll(".mp-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".mp-tab").forEach(t => t.setAttribute("aria-selected", "false"));
      tab.setAttribute("aria-selected", "true");
      const name = tab.getAttribute("data-tab");
      document.querySelectorAll(".mp-list").forEach(l => l.classList.remove("active"));
      const panelEl = $("mp-list-" + name);
      if (panelEl) panelEl.classList.add("active");
    });
  });

  toggle.addEventListener("click", () => setOpen(!panel.classList.contains("open")));
  closeBtn.addEventListener("click", () => { setOpen(false); toggle.focus(); });
  stopBtn.addEventListener("click", stop);
  widget.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && panel.classList.contains("open")) { setOpen(false); toggle.focus(); }
  });

  sizeBtn.addEventListener("click", () => {
    const tall = stage.dataset.tall !== "1";
    stage.dataset.tall = tall ? "1" : "0";
    sizeBtn.textContent = tall ? "hide tracks" : "show tracks";
    sizeBtn.setAttribute("aria-pressed", String(tall));
  });

  loopBtn.addEventListener("click", () => {
    state.loop = !state.loop;
    persist();
    loopBtn.setAttribute("aria-pressed", String(state.loop));
    updateNow();
    // if currently playing a yt single, reload with loop param
    if (current && current.kind === "youtube" && current.ytId) {
      play(parseLink(current.url, state.loop), state.currentLabel);
    }
  });

  shuffleBtn.addEventListener("click", () => {
    state.shuffle = !state.shuffle;
    persist();
    shuffleBtn.setAttribute("aria-pressed", String(state.shuffle));
  });

  nextBtn.addEventListener("click", playNext);

  addQBtn.addEventListener("click", () => {
    if (!current) return;
    const fp = fingerprint(current);
    state.queue.push({
      url: current.url,
      label: state.currentLabel || defaultLabel(current),
      kind: current.kind,
      fp
    });
    persist();
    nextBtn.disabled = false;
    // switch to queue tab
    document.querySelectorAll(".mp-tab").forEach(t => {
      const on = t.getAttribute("data-tab") === "queue";
      t.setAttribute("aria-selected", String(on));
    });
    document.querySelectorAll(".mp-list").forEach(l => l.classList.remove("active"));
    listQueue.classList.add("active");
    renderAll();
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const raw = input.value;
    const p = parseLink(raw, state.loop);
    if (p.error) return showError(p.error);
    // try to use a nicer label if the raw string looks like a title was pasted with url - rare
    let hint = null;
    // if history already has this fp, keep name
    const fp = fingerprint(p);
    const old = state.history.find(h => h.fp === fp);
    if (old) hint = old.label;
    play(p, hint);
  });
  input.addEventListener("input", () => showError(""));

  // optional: rename history item via long-press? skip for simplicity

  renderAll();
})();
</script>

</body></html>
